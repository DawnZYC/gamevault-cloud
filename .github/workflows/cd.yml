# ==========================================
# CD Workflow - Build Docker Images and Deploy to EC2
# For GameVault Cloud Microservices
# Deployment Method: Docker Compose
# ==========================================

name: "CD - Build and Deploy to EC2"

on:
  push:
    branches: [prod/master_no_k8s]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_TAG: latest

jobs:
  build-and-push:
    environment: production
    runs-on: ubuntu-latest
    name: Build and Push Docker Images
    strategy:
      fail-fast: false
      matrix:
        service:
          - gamevault-gateway
          - gamevault-auth
          - gamevault-shopping
          - gamevault-forum
          - gamevault-developer
          - gamevault-social

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate RSA certificates
        run: |
          # 为认证服务生成 RSA 证书
          mkdir -p gamevault-auth/src/main/resources/certs
          openssl genrsa -out gamevault-auth/src/main/resources/certs/rsa-private.pem 2048
          openssl rsa -in gamevault-auth/src/main/resources/certs/rsa-private.pem -pubout -out gamevault-auth/src/main/resources/certs/rsa-public.pem
          
          # 为论坛服务生成公钥（复制认证服务的公钥）
          mkdir -p gamevault-forum/src/main/resources/certs
          cp gamevault-auth/src/main/resources/certs/rsa-public.pem gamevault-forum/src/main/resources/certs/public.pem
          
          echo "RSA certificates generated successfully"

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-to: type=inline

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: Deploy to EC2 via Docker Compose
    if: github.ref == 'refs/heads/prod/master_no_k8s'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Initialize EC2 environment
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Initializing deployment environment..."
          
            # 检查 Docker 是否安装
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
              rm get-docker.sh
            fi
          
            # 检查 Docker Compose 是否安装
            if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi
          
            echo "Docker and Docker Compose are ready"
          EOF

      - name: Create directory structure
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Creating directory structure..."
          
            mkdir -p ~/gamevault-cloud/docker/postgres/data
            mkdir -p ~/gamevault-cloud/docker/postgres/init
            mkdir -p ~/gamevault-cloud/docker/nacos/logs
            mkdir -p ~/gamevault-cloud/docker/nacos/data
            mkdir -p ~/gamevault-cloud/docker/redis/data
            mkdir -p ~/gamevault-cloud/docker/minio/data
            mkdir -p ~/gamevault-cloud/docker/minio/config
            mkdir -p ~/gamevault-cloud/docker/uploads
          
            sudo chmod -R 755 ~/gamevault-cloud/docker
          
            echo "Directory structure created"
          EOF

      - name: Copy deployment files to EC2
        run: |
          scp -i ~/.ssh/ec2_key docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/gamevault-cloud/
          scp -r -i ~/.ssh/ec2_key nginx/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/gamevault-cloud/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/gamevault-cloud

            echo "Creating .env file for docker-compose..."
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            echo "IMAGE_TAG=latest" >> .env
            echo "EC2_PUBLIC_IP=${{ secrets.EC2_HOST }}" >> .env
            
            echo "Checking files in current directory..."
            ls -la
            echo "Checking if docker-compose.prod.yml exists..."
            if [ -f "docker-compose.prod.yml" ]; then
              echo "✅ docker-compose.prod.yml found"
            else
              echo "❌ docker-compose.prod.yml NOT found"
              exit 1
            fi
  
            echo "Pulling latest images..."
            sudo docker compose -f docker-compose.prod.yml pull
            
            echo "Stopping old containers..."
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans
            
            echo "Cleaning up any remaining containers..."
            sudo docker container prune -f
            
            echo "Removing any conflicting containers..."
            sudo docker rm -f gamevault-postgres gamevault-redis gamevault-minio gamevault-nacos gamevault-gateway gamevault-auth gamevault-shopping gamevault-forum gamevault-developer gamevault-social gamevault-nginx 2>/dev/null || true
            
            echo "Starting infrastructure services..."
            sudo docker compose -f docker-compose.prod.yml up -d postgres redis minio
            
            echo "Waiting for infrastructure services..."
            sleep 30
            
            echo "Starting Nacos..."
            sudo docker compose -f docker-compose.prod.yml up -d nacos
            
            echo "Waiting for Nacos to be ready..."
            sleep 90
            
            echo "Starting microservices..."
            sudo docker compose -f docker-compose.prod.yml up -d gateway auth shopping forum developer social
            
            echo "Waiting for microservices..."
            sleep 60
            
            echo "Starting Nginx..."
            sudo docker compose -f docker-compose.prod.yml up -d nginx
            
            echo "Waiting for all services..."
            sleep 30
            
            echo "Deployment complete!"
            sudo docker compose -f docker-compose.prod.yml ps 
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
