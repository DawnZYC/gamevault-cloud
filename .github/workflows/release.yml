name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'prod/master_no_k8s'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 创建发布 ====================
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # ==================== 构建发布镜像 ====================
  build-release-images:
    needs: create-release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [gateway, auth, shopping, forum, developer, social]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Maven project
        run: |
          mvn clean package -DskipTests
          cd gamevault-${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./gamevault-${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 生成发布说明 ====================
  generate-changelog:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个标签
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## 更新内容" > changelog.md
            echo "" >> changelog.md
            echo "### 新增功能" >> changelog.md
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD --grep="feat:" >> changelog.md || echo "- 无新增功能" >> changelog.md
            echo "" >> changelog.md
            echo "### 修复问题" >> changelog.md
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD --grep="fix:" >> changelog.md || echo "- 无修复问题" >> changelog.md
            echo "" >> changelog.md
            echo "### 其他更新" >> changelog.md
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD --grep="chore:" >> changelog.md || echo "- 无其他更新" >> changelog.md
          else
            echo "## 首次发布" > changelog.md
            echo "" >> changelog.md
            echo "这是 GameVault 微服务系统的首次发布。" >> changelog.md
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.md', 'utf8');
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: changelog
            });

  # ==================== 部署到生产环境 ====================
  deploy-production:
    needs: [create-release, build-release-images]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /opt/gamevault
            
            # 备份当前版本
            /opt/gamevault/backup.sh
            
            # 更新镜像标签
            sed -i 's/:latest/:${{ github.ref_name }}/g' docker-compose.prod.yml
            
            # 拉取新版本镜像
            docker compose -f docker-compose.prod.yml pull
            
            # 滚动更新服务
            docker compose -f docker-compose.prod.yml up -d --no-deps --build
            
            # 等待服务启动
            sleep 60
            
            # 健康检查
            /opt/gamevault/monitor.sh
            
            # 清理旧镜像
            docker image prune -f
          EOF

      - name: Production health check
        run: |
          # 等待服务完全启动
          sleep 120
          
          # 检查所有服务健康状态
          SERVICES=("gateway" "auth" "shopping" "forum" "developer" "social")
          PORTS=("8080" "8081" "8082" "8083" "8084" "8089")
          
          for i in "${!SERVICES[@]}"; do
            SERVICE="${SERVICES[$i]}"
            PORT="${PORTS[$i]}"
            
            if curl -f http://${{ secrets.EC2_HOST }}:$PORT/actuator/health; then
              echo "✅ $SERVICE 服务健康"
            else
              echo "❌ $SERVICE 服务不健康"
              exit 1
            fi
          done
          
          echo "🎉 生产环境部署成功！"

  # ==================== 发送通知 ====================
  notify:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "🎉 版本 ${{ github.ref_name }} 发布成功！"
            echo "服务地址: http://${{ secrets.EC2_HOST }}"
            echo "镜像仓库: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          else
            echo "❌ 版本 ${{ github.ref_name }} 发布失败！"
          fi
