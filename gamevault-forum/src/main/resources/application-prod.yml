server:
  port: 8083
  # 生产环境服务器配置
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    accept-count: 100
    max-swallow-size: 5MB
    max-http-form-post-size: 10MB

spring:
  application:
    name: gamevault-forum

  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: prod
        group: GAMEVAULT_GROUP
        ip: ${POD_IP:forum}
        register-enabled: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        enabled: false
        import-check:
          enabled: false

  # 数据源配置 - Docker Compose 环境
  datasource:
    url: jdbc:postgresql://postgres:5432/gamevault_forum
    username: gamevault_user
    password: gamevault_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
      file-size-threshold: 1MB
      location: /uploads

# MyBatis 配置
mybatis:
  mapper-locations: classpath:forum/*.xml
  type-aliases-package: com.sg.nusiss.forum.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 生产环境使用 slf4j
    cache-enabled: true  # 启用二级缓存
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

# JWT 配置
jwt:
  secret: "1TuQdaZEWG0U7EiIkrGX1xvbaCJDT7XAsksekHxxFgE="
  expiration: 864000000

# HashId 配置
hashid:
  salt: "forum-backend-2024"

# RSA 公钥配置
rsa:
  public-key: classpath:certs/public.pem

# 应用配置
app:
  upload:
    path: /uploads
    max-file-size: 5MB
    max-request-size: 10MB
  pagination:
    default-page-size: 20
    max-page-size: 100

# 认证配置
auth:
  mock:
    enabled: false

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.sg.nusiss.forum: INFO
    com.sg.nusiss.forum.mapper: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    # MyBatis SQL 日志
    org.apache.ibatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/forum-service.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB