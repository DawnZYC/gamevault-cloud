name: CD - Deploy to EC2

on:
  push:
    branches: [prod/master_no_k8s]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/gamevault

jobs:
  # ==================== 构建所有服务 ====================
  build:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 生成 RSA 证书
        run: |
          echo "生成 RSA 证书..."
          mkdir -p gamevault-auth/src/main/resources/certs
          openssl genrsa -out gamevault-auth/src/main/resources/certs/rsa-private.pem 2048
          openssl rsa -in gamevault-auth/src/main/resources/certs/rsa-private.pem -pubout -out gamevault-auth/src/main/resources/certs/rsa-public.pem
          
          mkdir -p gamevault-forum/src/main/resources/certs
          mkdir -p gamevault-shopping/src/main/resources/certs
          mkdir -p gamevault-social/src/main/resources/certs
          cp gamevault-auth/src/main/resources/certs/rsa-public.pem gamevault-forum/src/main/resources/certs/public.pem
          cp gamevault-auth/src/main/resources/certs/rsa-public.pem gamevault-shopping/src/main/resources/certs/public.pem
          cp gamevault-auth/src/main/resources/certs/rsa-public.pem gamevault-social/src/main/resources/certs/public.pem

      - name: Maven 构建
        run: |
          echo "开始构建所有微服务..."
          mvn clean package -DskipTests -B
          echo "✅ 构建完成"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            gamevault-gateway/target/*.jar
            gamevault-auth/target/*.jar
            gamevault-shopping/target/*.jar
            gamevault-forum/target/*.jar
            gamevault-developer/target/*.jar
            gamevault-social/target/*.jar
          retention-days: 1

  # ==================== 构建并推送 Docker 镜像 ====================
  push-images:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth, shopping, forum, developer, social]
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: 转换仓库所有者名称为小写
        id: lowercase
        run: |
          echo "owner_lowercase=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./gamevault-${{ matrix.service }}
          file: ./gamevault-${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner_lowercase }}/gamevault-cloud-${{ matrix.service }}:latest
            ghcr.io/${{ steps.lowercase.outputs.owner_lowercase }}/gamevault-cloud-${{ matrix.service }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到 EC2 ====================
  deploy:
    runs-on: ubuntu-latest
    needs: push-images
    environment: production
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 准备部署文件
        run: |
          # 创建临时部署目录
          mkdir -p deploy_temp
          
          # 复制必要文件
          cp docker-compose.prod.yml deploy_temp/
          cp -r nginx deploy_temp/
          cp -r scripts deploy_temp/
          
          # 创建 .env 文件（转换为小写）
          OWNER_LOWERCASE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          cat > deploy_temp/.env << EOF
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_PREFIX=${OWNER_LOWERCASE}/gamevault-cloud
          IMAGE_TAG=latest
          EOF

      - name: 上传部署文件到 EC2
        run: |
          # 上传部署文件
          scp -i ~/.ssh/ec2_key -r deploy_temp/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/gamevault-deploy/
          
          # 上传完成
          echo "✅ 部署文件上传完成"

      - name: 初始化 EC2 环境
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "=========================================="
            echo "初始化 EC2 部署环境"
            echo "=========================================="
            
            # 检查 Docker
            if ! command -v docker &> /dev/null; then
              echo "安装 Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
              rm get-docker.sh
            fi
            
            # 检查 Docker Compose
            if ! docker compose version &> /dev/null; then
              echo "安装 Docker Compose..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi
            
            # 创建目录结构
            echo "创建目录结构..."
            sudo mkdir -p /opt/gamevault
            sudo chown -R $USER:$USER /opt/gamevault
            
            mkdir -p /opt/gamevault/{data,logs,uploads,backups}
            mkdir -p /opt/gamevault/data/{postgres,redis,nacos,minio}
            
            echo "✅ 环境初始化完成"
          ENDSSH

      - name: 步骤 1 - 清理和准备
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            echo "=========================================="
            echo "步骤 1: 清理和准备"
            echo "=========================================="
            
            sudo rm -rf /opt/gamevault/nginx
            cp -r /tmp/gamevault-deploy/* /opt/gamevault/
            cd /opt/gamevault
            
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            # 彻底清理
            docker ps -a --filter "name=gamevault-" -q | xargs -r docker stop 2>/dev/null || true
            docker ps -a --filter "name=gamevault-" -q | xargs -r docker rm -f 2>/dev/null || true
            docker compose -f docker-compose.prod.yml down --remove-orphans --volumes 2>/dev/null || true
            docker container prune -f
            docker network prune -f
            
            # 拉取镜像
            docker compose -f docker-compose.prod.yml pull
            echo "✅ 步骤 1 完成"
          EOF

      - name: 步骤 2 - 启动基础设施
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /opt/gamevault
            echo "=========================================="
            echo "步骤 2: 启动基础设施"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml up -d postgres redis minio
            sleep 30
            echo "✅ 步骤 2 完成"
          EOF

      - name: 步骤 3 - 启动 Nacos（后台运行）
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /opt/gamevault
            echo "=========================================="
            echo "步骤 3: 启动 Nacos"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml up -d nacos
            echo "✅ Nacos 已启动，后台初始化中..."
          EOF
      
      - name: 步骤 4 - 等待 Nacos 就绪
        run: |
          echo "等待 Nacos 初始化（120秒）..."
          for i in {1..12}; do
            echo "等待进度: $((i*10))/120 秒"
            sleep 10
          done

      - name: 步骤 5 - 启动微服务
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /opt/gamevault
            echo "=========================================="
            echo "步骤 5: 启动微服务"
            echo "=========================================="
            docker compose -f docker-compose.prod.yml up -d gateway auth shopping forum developer social nginx
            sleep 30
            docker compose -f docker-compose.prod.yml ps
            echo "✅ 部署完成！"
          EOF

      - name: 健康检查
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "=========================================="
            echo "执行健康检查..."
            echo "=========================================="
            
            cd /opt/gamevault
            
            # 等待服务完全启动
            sleep 30
            
            # 检查各服务健康状态
            SERVICES=("gateway:8080" "auth:8081" "shopping:8082" "forum:8083" "developer:8084" "social:8089")
            
            for service in "${SERVICES[@]}"; do
              IFS=':' read -r name port <<< "$service"
              if curl -sf http://localhost:${port}/actuator/health > /dev/null; then
                echo "✅ ${name} 服务健康"
              else
                echo "⚠️  ${name} 服务可能未完全启动（这可能是正常的，服务仍在初始化中）"
              fi
            done
            
            echo ""
            echo "=========================================="
            echo "容器状态："
            echo "=========================================="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
          ENDSSH

      - name: 清理临时文件
        if: always()
        run: |
          # 先清理 EC2 上的临时文件
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "rm -rf /tmp/gamevault-deploy" 2>/dev/null || true
          # 再删除本地 SSH 密钥
          rm -f ~/.ssh/ec2_key

  # ==================== 部署总结 ====================
  summary:
    runs-on: ubuntu-latest
    needs: [build, push-images, deploy]
    if: always()
    
    steps:
      - name: 生成部署报告
        run: |
          echo "## 🚀 部署执行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 阶段 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 推送镜像 | ${{ needs.push-images.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "### ✅ 部署成功！" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**访问地址**: http://${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
            echo "**镜像仓库**: ghcr.io/${OWNER_LOWER}/gamevault-cloud" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
            echo "请检查上述步骤的错误日志" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
