name: Continuous Deployment (CD)

on:
  push:
    branches: [ main, prod/master_no_k8s ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: '强制部署（跳过检查）'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 部署准备 ====================
  prepare-deployment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should_deploy: ${{ steps.check-deploy.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Check if should deploy
        id: check-deploy
        run: |
          if [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/prod/master_no_k8s" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Deployment info
        run: |
          echo "部署环境: ${{ steps.set-env.outputs.environment }}"
          echo "是否部署: ${{ steps.check-deploy.outputs.should_deploy }}"
          echo "触发分支: ${{ github.ref }}"

  # ==================== 构建镜像 ====================
  build-images:
    needs: prepare-deployment
    runs-on: ubuntu-latest
    if: needs.prepare-deployment.outputs.should_deploy == 'true'
    
    strategy:
      matrix:
        service: [gateway, auth, shopping, forum, developer, social]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Maven project
        run: |
          # 构建整个多模块项目
          mvn clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.prepare-deployment.outputs.environment }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./gamevault-${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到测试环境 ====================
  # 暂时禁用 staging 环境，直接部署到 production

  # ==================== 部署到生产环境 ====================
  deploy-production:
    needs: [prepare-deployment, build-images]
    runs-on: ubuntu-latest
    if: needs.prepare-deployment.outputs.should_deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # 确保密钥格式正确，移除可能的换行符
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 验证密钥格式
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "SSH key validation failed"
          # 添加主机到 known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          # 测试连接
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH connection test successful'"

      - name: Setup EC2 environment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # 创建目录
            sudo mkdir -p /opt/gamevault
            sudo chown $USER:$USER /opt/gamevault
            
            # 创建基本目录结构
            mkdir -p /opt/gamevault/{logs,uploads,backups}
            
            echo "EC2 环境设置完成"
          EOF

      - name: Copy deployment files
        run: |
          # 复制部署文件到 EC2
          scp docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/gamevault/
          scp -r nginx/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/gamevault/
          scp -r scripts/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/gamevault/
          
          # 设置权限
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            chmod +x /opt/gamevault/scripts/*.sh
            echo "部署文件复制完成"
          EOF

      - name: Deploy to production
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /opt/gamevault
            
            # 拉取最新镜像
            docker compose -f docker-compose.prod.yml pull
            
            # 停止旧服务
            docker compose -f docker-compose.prod.yml down
            
            # 启动新服务
            docker compose -f docker-compose.prod.yml up -d
            
            # 等待服务启动
            sleep 60
            
            # 检查服务状态
            docker ps
            echo "部署完成"
          EOF

      - name: Production health check
        run: |
          sleep 120
          
          # 检查所有服务
          SERVICES=("gateway" "auth" "shopping" "forum" "developer" "social")
          PORTS=("8080" "8081" "8082" "8083" "8084" "8089")
          
          for i in "${!SERVICES[@]}"; do
            SERVICE="${SERVICES[$i]}"
            PORT="${PORTS[$i]}"
            
            if curl -f http://${{ secrets.EC2_HOST }}:$PORT/actuator/health; then
              echo "✅ $SERVICE 服务健康"
            else
              echo "❌ $SERVICE 服务不健康"
              exit 1
            fi
          done
          
          echo "🎉 生产环境部署成功！"

  # ==================== 部署后验证 ====================
  post-deployment-verification:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always() && needs.deploy-production.result == 'success'
    
    steps:
      - name: Run smoke tests
        run: |
          echo "运行生产环境冒烟测试..."
          # 这里可以添加具体的冒烟测试

      - name: Notify deployment status
        run: |
          echo "🎉 生产环境部署成功！"
          echo "生产环境地址: http://${{ secrets.EC2_HOST }}"

  # ==================== 部署失败回滚 ====================
  rollback:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    
    steps:
      - name: Rollback deployment
        run: |
          echo "回滚生产环境..."
          # 回滚逻辑

      - name: Notify rollback
        run: |
          echo "❌ 部署失败，已执行回滚操作"
          echo "请检查日志并修复问题后重新部署"
